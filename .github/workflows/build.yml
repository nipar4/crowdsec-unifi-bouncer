name: Build & Push

# Publishes to Docker Hub (nipar44/crowdsec-unifi-bouncer). Modeled on
# nipar4/predbat_addon's real, working sync-predbat.yml `build` job --
# docker/setup-buildx-action + docker/build-push-action on GitHub-hosted
# ubuntu-latest runners, which already have Docker on the bare VM.
#
# Deliberately simpler than predbat_addon's build job: no upstream-version
# sync (this is fully our own code, nothing to track), no noble/alpine/slim
# build matrix (one Dockerfile), no QEMU/multi-arch (this fleet is x86-64
# only). This is also this project's second build pipeline -- the first
# attempt ran on this homelab's own self-hosted Gitea Actions runners
# (see homelab-runbooks' crowdsec-unifi-bouncer-github-build-plan.md for
# why that was abandoned: a docker:24-dind service container's daemon
# never came up reachable from the job container, and self-hosted-runner
# service-container networking wasn't worth continuing to debug when
# GitHub-hosted runners don't need dind for this at all).

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'crowdsec_unifi_bouncer.py'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from the Dockerfile's own OCI label
        id: version
        run: |
          V=$(grep -oP 'org.opencontainers.image.version="\K[^"]+' Dockerfile)
          [ -n "$V" ] || { echo "Could not find version label in Dockerfile"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # DOCKER_USER/DOCKER_TOKEN, not DOCKERHUB_USERNAME/DOCKERHUB_TOKEN --
        # the latter got created empty on this repo (a "Password required"
        # login failure kept recurring even after re-saving it, secret's own
        # "last updated" timestamp never actually moved) and rather than
        # keep fighting whatever was wrong with it, this repo uses its own
        # separate secret names instead of touching/overwriting it.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nipar44/crowdsec-unifi-bouncer:latest
            nipar44/crowdsec-unifi-bouncer:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
